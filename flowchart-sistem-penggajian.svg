<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title description">
  <title id="title">Flowchart Sistem Penggajian</title>
  <desc id="description">Diagram alur akses pengguna, perbedaan hak admin dan pengguna, serta proses penghitungan gaji dari file CSV.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: .3px; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .section { font-size: 17px; font-weight: 700; fill: #475569; letter-spacing: 1.2px; }
      .node-title { font-size: 20px; font-weight: 700; }
      .node-text { font-size: 16px; fill: #475569; }
      .small { font-size: 14px; fill: #64748b; }
      .branch { font-size: 15px; font-weight: 700; fill: #475569; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .plain-line { fill: none; stroke: #94a3b8; stroke-width: 3; }
      .auth { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2.5; }
      .admin { fill: #ecfdf5; stroke: #34d399; stroke-width: 2.5; }
      .user { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; }
      .decision { fill: #fff7ed; stroke: #fb923c; stroke-width: 2.5; }
      .result { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2.5; }
      .startend { fill: #172033; stroke: #172033; stroke-width: 2; }
      .startend-text { fill: #ffffff; font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1600" fill="#f1f5f9"/>
  <text x="80" y="76" class="title">FLOWCHART SISTEM PENGGAJIAN</text>
  <text x="80" y="112" class="subtitle">Alur akses pengguna, pembagian hak akses, dan proses penghitungan gaji bulanan</text>

  <rect x="60" y="145" width="1680" height="440" rx="22" class="panel"/>
  <text x="95" y="190" class="section">01  AKSES DAN AUTENTIKASI</text>

  <ellipse cx="160" cy="370" rx="58" ry="34" class="startend"/>
  <text x="160" y="376" text-anchor="middle" class="startend-text">Mulai</text>

  <rect x="255" y="331" width="180" height="78" rx="16" class="auth"/>
  <text x="345" y="365" text-anchor="middle" class="node-title">Buka aplikasi</text>
  <text x="345" y="390" text-anchor="middle" class="small">Halaman utama</text>

  <polygon points="520,310 600,370 520,430 440,370" class="decision"/>
  <text x="520" y="365" text-anchor="middle" class="node-title">Pilih</text>
  <text x="520" y="389" text-anchor="middle" class="node-title">akses</text>

  <path d="M218 370 H255" class="line"/>
  <path d="M435 370 H440" class="line"/>

  <path d="M600 370 H630 V280 H680" class="line"/>
  <path d="M630 370 V385 H680" class="line"/>
  <path d="M630 385 V490 H680" class="line"/>

  <rect x="680" y="235" width="300" height="90" rx="16" class="auth"/>
  <text x="705" y="268" class="node-title">Login</text>
  <text x="705" y="293" class="node-text">Identitas baru otomatis menjadi akun User</text>
  <text x="705" y="314" class="small">Kata sandi salah: tampilkan pesan, coba lagi</text>

  <rect x="680" y="340" width="300" height="90" rx="16" class="auth"/>
  <text x="705" y="373" class="node-title">Daftar akun</text>
  <text x="705" y="398" class="node-text">Isi nama, email, dan kata sandi</text>
  <text x="705" y="419" class="small">Data valid membuat akun User</text>

  <rect x="680" y="445" width="300" height="90" rx="16" class="auth"/>
  <text x="705" y="478" class="node-title">Masuk sebagai tamu</text>
  <text x="705" y="503" class="node-text">Akses dashboard tanpa akun</text>
  <text x="705" y="524" class="small">Tidak memiliki hak proses penggajian</text>

  <path d="M980 280 H1080 V385 H1240" class="plain-line"/>
  <path d="M980 385 H1240" class="plain-line"/>
  <path d="M980 490 H1080 V385" class="plain-line"/>
  <path d="M1080 385 H1240" class="line"/>

  <rect x="1240" y="340" width="330" height="90" rx="18" class="admin"/>
  <text x="1405" y="375" text-anchor="middle" class="node-title">Dashboard</text>
  <text x="1405" y="402" text-anchor="middle" class="node-text">Tampilkan menu sesuai hak akses</text>

  <rect x="60" y="615" width="1680" height="920" rx="22" class="panel"/>
  <text x="95" y="660" class="section">02  HAK AKSES DAN PROSES PENGGAJIAN</text>

  <rect x="775" y="690" width="250" height="76" rx="16" class="auth"/>
  <text x="900" y="722" text-anchor="middle" class="node-title">Dashboard</text>
  <text x="900" y="746" text-anchor="middle" class="small">Pilih menu yang tersedia</text>

  <path d="M1405 430 V650 H900 V690" class="line"/>

  <polygon points="900,805 1000,870 900,935 800,870" class="decision"/>
  <text x="900" y="865" text-anchor="middle" class="node-title">Role</text>
  <text x="900" y="889" text-anchor="middle" class="node-title">Admin?</text>
  <path d="M900 766 V805" class="line"/>

  <path d="M800 870 H675 V1010 H585" class="line"/>
  <text x="705" y="855" class="branch">Tidak</text>
  <rect x="185" y="965" width="400" height="105" rx="16" class="user"/>
  <text x="385" y="1002" text-anchor="middle" class="node-title">User / Tamu</text>
  <text x="385" y="1028" text-anchor="middle" class="node-text">Lihat dashboard dan laporan</text>
  <text x="385" y="1051" text-anchor="middle" class="small">Tidak dapat memproses penggajian</text>

  <path d="M385 1070 V1170" class="line"/>
  <ellipse cx="385" cy="1205" rx="65" ry="32" class="startend"/>
  <text x="385" y="1211" text-anchor="middle" class="startend-text">Keluar</text>

  <path d="M1000 870 H1125 V1010 H1200" class="line"/>
  <text x="1032" y="855" class="branch">Ya</text>
  <rect x="1200" y="965" width="390" height="90" rx="16" class="admin"/>
  <text x="1395" y="1000" text-anchor="middle" class="node-title">Unggah dataset CSV</text>
  <text x="1395" y="1027" text-anchor="middle" class="node-text">Nama, gaji pokok, tunjangan, potongan</text>

  <path d="M1395 1055 V1080" class="line"/>
  <polygon points="1395,1080 1480,1135 1395,1190 1310,1135" class="decision"/>
  <text x="1395" y="1130" text-anchor="middle" class="node-title">Data</text>
  <text x="1395" y="1153" text-anchor="middle" class="node-title">valid?</text>

  <path d="M1310 1135 H1190" class="line"/>
  <text x="1230" y="1118" class="branch">Tidak</text>
  <rect x="870" y="1090" width="320" height="90" rx="16" class="user"/>
  <text x="1030" y="1125" text-anchor="middle" class="node-title">Perbaiki dataset</text>
  <text x="1030" y="1152" text-anchor="middle" class="node-text">Cek format dan nilai gaji</text>
  <path d="M1030 1090 V930 H1395 V965" class="line"/>

  <path d="M1395 1190 V1215" class="line"/>
  <text x="1410" y="1208" class="branch">Ya</text>
  <rect x="1200" y="1215" width="390" height="90" rx="16" class="admin"/>
  <text x="1395" y="1250" text-anchor="middle" class="node-title">Konfirmasi dan hitung</text>
  <text x="1395" y="1277" text-anchor="middle" class="node-text">Gaji bersih = pokok + tunjangan - potongan</text>

  <path d="M1395 1305 V1330" class="line"/>
  <rect x="1200" y="1330" width="390" height="90" rx="16" class="result"/>
  <text x="1395" y="1365" text-anchor="middle" class="node-title">Tampilkan hasil</text>
  <text x="1395" y="1392" text-anchor="middle" class="node-text">Jumlah pegawai, total gaji, status Selesai</text>

  <path d="M1395 1420 V1450" class="line"/>
  <ellipse cx="1395" cy="1480" rx="65" ry="32" class="startend"/>
  <text x="1395" y="1486" text-anchor="middle" class="startend-text">Selesai</text>

  <text x="95" y="1500" class="small">Catatan: hasil proses saat ini disimpan dalam session aplikasi, belum menjadi arsip payroll permanen di database.</text>
</svg>
